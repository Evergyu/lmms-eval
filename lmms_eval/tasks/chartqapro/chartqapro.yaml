# 원래 dataset_path였던 lmms-lab/ChartQAPro는 HF 허브에 존재하지 않음 → 공식(논문 저자) 데이터셋으로 교체
dataset_path: ahmed-masry/ChartQAPro
dataset_kwargs:
  token: True
task: "chartqapro"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.chartqapro_doc_to_visual
doc_to_text: !function utils.chartqapro_doc_to_text
doc_to_target: "Answer"   # 데이터셋 실제 필드명 (소문자 'answer' 필드는 없음)
generation_kwargs:
  max_new_tokens: 64   # 복수 답(['A','B'] 형식)·구 단위 답이 있어 16으로는 잘림
  temperature: 0
  do_sample: False
process_results: !function utils.chartqapro_process_results
metric_list:
  - metric: relaxed_overall
    aggregation: mean
    higher_is_better: true
metadata:
  - version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question with a single word."
  qwen_vl:
    pre_prompt: ""
    post_prompt: " Answer:"
